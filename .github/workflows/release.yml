name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_native:
    name: Native Rust preview (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Install native build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libasound2-dev libclang-dev libudev-dev libwayland-dev libx11-dev libxkbcommon-dev libxkbcommon-x11-dev pkg-config
      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        run: choco install cmake llvm -y --no-progress
      - name: Configure LLVM (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"
          echo "C:\\Program Files\\LLVM\\bin" >> "$GITHUB_PATH"
      - name: Build and smoke-test native package
        shell: bash
        run: scripts/build-native.sh --output-dir "$RUNNER_TEMP/codex-monitor-native"
      - name: Upload unsigned native package
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform.name }}
          path: ${{ runner.temp }}/codex-monitor-native/*
          if-no-files-found: error
