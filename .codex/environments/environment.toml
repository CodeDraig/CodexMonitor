version = 1
name = "CodexMonitor"

[setup]
script = "cargo fetch --locked --manifest-path src-tauri/Cargo.toml"

[[actions]]
name = "Tests"
icon = "test"
command = '''
python3 scripts/check-native-only.py
cargo test --locked --no-default-features --features native-acceptance --manifest-path src-tauri/Cargo.toml
'''

[[actions]]
name = "Run"
icon = "run"
command = "cargo run --locked --manifest-path src-tauri/Cargo.toml --bin codex_monitor_native"
