[package]
name = "codex-monitor"
version = "0.7.68"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "codex-monitor"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["tauri-host"]
acp-host-services = ["dep:portable-pty"]
tauri-host = [
  "dep:tauri",
  "dep:tauri-build",
  "dep:tauri-plugin-liquid-glass",
  "dep:tauri-plugin-notification",
  "dep:tauri-plugin-opener",
  "dep:tauri-plugin-process",
  "dep:tauri-plugin-dialog",
  "dep:tauri-plugin-updater",
  "dep:tauri-plugin-window-state",
  "dep:cpal",
  "dep:whisper-rs",
  "acp-host-services",
  "dep:objc2",
  "dep:objc2-app-kit",
  "dep:objc2-foundation",
  "dep:objc2-av-foundation",
  "dep:block2",
]
native-gui = [
  "dep:eframe",
  "dep:egui",
  "dep:egui_extras",
  "dep:pulldown-cmark",
  "dep:syntect",
  "dep:alacritty_terminal",
  "dep:image",
  "dep:rfd",
  "dep:arboard",
  "acp-host-services",
  "dep:cpal",
  "dep:whisper-rs",
  "dep:ed25519-dalek",
  "dep:notify-rust",
  "dep:tray-icon",
  "dep:rodio",
  "dep:flate2",
  "dep:tar",
  "dep:zip",
  "dep:thiserror",
  "dep:fontique",
]
native-acceptance = ["native-gui", "eframe/inspection"]
custom-protocol = ["tauri-host", "tauri/custom-protocol"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "codex_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "codex-monitor"
path = "src/main.rs"
required-features = ["tauri-host"]

[[bin]]
name = "codex_monitor_native"
path = "src/bin/codex_monitor_native.rs"
required-features = ["native-gui"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [], optional = true }

[dependencies]
tauri = { version = "2.10.3", features = ["protocol-asset", "macos-private-api", "tray-icon", "image-png"], optional = true }
tauri-plugin-liquid-glass = { version = "0.1", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
tokio = { version = "1", features = ["fs", "net", "io-util", "process", "rt", "sync", "time", "macros", "signal"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v4"] }
tauri-plugin-dialog = { version = "2", optional = true }
git2 = { version = "0.20.3", features = ["vendored-openssl", "vendored-libgit2"] }
base64 = "0.22"
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs" }
dirs = "6"
sha2 = "0.10"
ignore = "0.4.25"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
libc = "0.2"
chrono = { version = "0.4", features = ["clock"] }
shell-words = "1.1"
toml_edit = "0.20.2"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-updater = { version = "2.10.0", optional = true }
tauri-plugin-window-state = { version = "2", optional = true }
cpal = { version = "0.15", optional = true }
whisper-rs = { version = "0.12", optional = true }
portable-pty = { version = "0.8", optional = true }
ed25519-dalek = { version = "3.0.0", optional = true }
notify-rust = { version = "4.18.2", optional = true }
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "links", "system_fonts", "wayland", "wgpu", "x11"], optional = true }
egui = { version = "=0.37.0", default-features = false, features = ["default_fonts"], optional = true }
egui_extras = { version = "=0.37.0", default-features = false, features = ["image", "gif", "webp", "svg"], optional = true }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"], optional = true }
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"], optional = true }
alacritty_terminal = { version = "=0.26.0", optional = true }
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "gif", "webp"], optional = true }
rfd = { version = "0.16.0", default-features = false, features = ["xdg-portal", "wayland", "tokio"], optional = true }
arboard = { version = "3.7.0", optional = true }
rodio = { version = "0.20.1", default-features = false, features = ["mp3", "vorbis", "wav"], optional = true }
flate2 = { version = "1", optional = true }
tar = { version = "0.4", optional = true }
zip = { version = "4.6", default-features = false, features = ["deflate"], optional = true }
thiserror = { version = "2", optional = true }
fontique = { version = "=0.11.1", optional = true }

[target."cfg(target_os = \"macos\")".dependencies]
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", features = ["NSAppearance", "NSResponder", "NSWindow"], optional = true }
objc2-foundation = { version = "0.3", features = ["NSString"], optional = true }
objc2-av-foundation = { version = "0.3", features = ["AVCaptureDevice", "AVMediaFormat"], optional = true }
block2 = { version = "0.6", optional = true }

[target."cfg(target_os = \"ios\")".dependencies]
objc2 = { version = "0.6", optional = true }

[target."cfg(any(target_os = \"macos\", target_os = \"windows\"))".dependencies]
tray-icon = { version = "0.21.3", default-features = false, optional = true }

[dev-dependencies]
egui_kittest = { version = "=0.37.0", features = ["wgpu"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
